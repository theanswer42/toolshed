# Egress proxy (INV-4). Implements the egress proxy contract in PROJECT_SPEC.md:
# CONNECT to port 443 on allowlisted domains only; everything else denied.

http_port 3128

# -n: never match by reverse DNS, so a CONNECT to a bare IP cannot match a domain.
acl allowlist dstdomain -n "/etc/squid/allowlist.dstdomain"
acl https_port port 443
acl CONNECT method CONNECT

http_access deny !CONNECT
http_access deny !https_port
http_access deny to_localhost
http_access deny to_linklocal
http_access allow CONNECT allowlist
http_access deny all

# No caching, no disk state.
cache deny all
cache_mem 0 MB

# One line per request, allowed or denied, with the domain, to stdout.
logformat egress %ts.%03tu %>a %Ss/%03>Hs %rm %ru
access_log stdio:/dev/stdout egress
cache_log stdio:/dev/stderr
logfile_rotate 0

# Runs as a non-root user with a read-only root filesystem.
pid_filename none
pinger_enable off
coredump_dir none
shutdown_lifetime 1 seconds
via off
forwarded_for delete
httpd_suppress_version_string on
